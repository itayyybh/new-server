<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Engineering Command Center</title>
<meta name="description" content="Personal source of truth for projects, pipelines, AI/ML concepts, tasks and evidence.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232a78d6'/%3E%3Cpath d='M8 21l5-5 4 4 7-9' stroke='white' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
:root {
  color-scheme: light;
  --bg: #f7f7f5; --surface: #fcfcfb; --surface-2: #f1f0ed; --surface-3: #e8e7e3;
  --border: #e3e2de; --border-strong: #cfcdc7;
  --text: #0b0b0b; --text-2: #52514e; --text-3: #7a7974;
  --accent: #2a78d6; --accent-soft: #e6f0fb; --accent-text: #1c5cab;
  --good: #0ca30c; --good-text: #006300; --warn: #fab219; --warn-text: #8a5a00;
  --serious: #ec835a; --serious-text: #9c3d12; --critical: #d03b3b; --critical-text: #a42727;
  --violet: #6250d6; --violet-text: #4a3aa7; --neutral: #8f8d87;
  --m1: #b7d3f6; --m2: #86b6ef; --m3: #5598e7; --m4: #2a78d6; --m5: #1c5cab;
  --shadow: 0 1px 2px rgba(0,0,0,.04), 0 4px 16px rgba(0,0,0,.05);
  --radius: 10px; --radius-sm: 6px;
  --font: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #121211; --surface: #1a1a19; --surface-2: #222220; --surface-3: #2c2c29;
    --border: #2e2e2b; --border-strong: #3d3d39;
    --text: #f0efec; --text-2: #c3c2b7; --text-3: #8f8e86;
    --accent: #3987e5; --accent-soft: #1b2a3d; --accent-text: #86b6ef;
    --good-text: #4cc94c; --warn-text: #fab219; --serious-text: #ec835a; --critical-text: #e66767;
    --violet: #9085e9; --violet-text: #b2aaf0; --neutral: #75746d;
    --m1: #184f95; --m2: #1c5cab; --m3: #2a78d6; --m4: #5598e7; --m5: #9ec5f4;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #121211; --surface: #1a1a19; --surface-2: #222220; --surface-3: #2c2c29;
  --border: #2e2e2b; --border-strong: #3d3d39;
  --text: #f0efec; --text-2: #c3c2b7; --text-3: #8f8e86;
  --accent: #3987e5; --accent-soft: #1b2a3d; --accent-text: #86b6ef;
  --good-text: #4cc94c; --warn-text: #fab219; --serious-text: #ec835a; --critical-text: #e66767;
  --violet: #9085e9; --violet-text: #b2aaf0; --neutral: #75746d;
  --m1: #184f95; --m2: #1c5cab; --m3: #2a78d6; --m4: #5598e7; --m5: #9ec5f4;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.3);
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--text); font: 14px/1.5 var(--font); -webkit-font-smoothing: antialiased; }
a { color: var(--accent-text); text-decoration: none; }
a:hover { text-decoration: underline; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
h1, h2, h3, h4 { margin: 0; font-weight: 600; letter-spacing: -0.01em; }
h1 { font-size: 22px; } h2 { font-size: 16px; } h3 { font-size: 14px; } h4 { font-size: 13px; color: var(--text-2); }
p { margin: 0; }
code, .mono { font-family: var(--mono); font-size: 12.5px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* Layout */
.app { display: grid; grid-template-columns: 232px minmax(0, 1fr); min-height: 100vh; }
.sidebar { position: sticky; top: 0; height: 100vh; border-right: 1px solid var(--border); background: var(--surface); padding: 14px 10px; display: flex; flex-direction: column; gap: 4px; overflow-y: auto; }
.brand { display: flex; align-items: center; gap: 9px; padding: 4px 8px 12px; font-weight: 600; }
.brand-mark { width: 22px; height: 22px; border-radius: 6px; background: var(--accent); display: grid; place-items: center; color: #fff; flex: none; }
.brand small { display: block; font-weight: 400; color: var(--text-3); font-size: 11.5px; }
.nav a { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: var(--radius-sm); color: var(--text-2); font-weight: 500; }
.nav a:hover { background: var(--surface-2); text-decoration: none; color: var(--text); }
.nav a[aria-current="page"] { background: var(--accent-soft); color: var(--accent-text); }
.nav .count { margin-left: auto; font-size: 11.5px; color: var(--text-3); font-variant-numeric: tabular-nums; }
.nav kbd { margin-left: auto; }
.sidebar-foot { margin-top: auto; padding: 10px 8px 0; border-top: 1px solid var(--border); color: var(--text-3); font-size: 12px; display: grid; gap: 6px; }
.main { min-width: 0; display: flex; flex-direction: column; }
.topbar { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 10px; padding: 10px 24px; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--border); }
.content { padding: 24px; max-width: 1280px; width: 100%; margin: 0 auto; display: grid; gap: 20px; }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.page-head p { color: var(--text-2); margin-top: 4px; max-width: 760px; }
.crumbs { font-size: 12.5px; color: var(--text-3); margin-bottom: 4px; }
.crumbs a { color: var(--text-3); }

/* Controls */
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 6px 11px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--surface); cursor: pointer; font-weight: 500; font-size: 13px; white-space: nowrap; }
.btn:hover { border-color: var(--border-strong); background: var(--surface-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { filter: brightness(1.06); }
.btn.danger { color: var(--critical-text); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { background: var(--surface-2); }
.btn.sm { padding: 3px 8px; font-size: 12px; }
.icon-btn { width: 32px; height: 32px; padding: 0; justify-content: center; }
.search { position: relative; flex: 1; max-width: 560px; }
.search input { width: 100%; padding: 7px 12px 7px 32px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface); }
.search svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--text-3); }
.search kbd { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); }
kbd { font: 11px var(--mono); padding: 1px 5px; border: 1px solid var(--border); border-bottom-width: 2px; border-radius: 4px; color: var(--text-3); background: var(--surface); }
.results { position: absolute; top: calc(100% + 6px); left: 0; right: 0; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); max-height: 60vh; overflow: auto; padding: 6px; z-index: 50; }
.results[hidden] { display: none; }
.result { display: flex; gap: 10px; align-items: baseline; padding: 7px 9px; border-radius: var(--radius-sm); cursor: pointer; }
.result[aria-selected="true"], .result:hover { background: var(--accent-soft); }
.result .kind { font-size: 11px; color: var(--text-3); width: 64px; flex: none; text-transform: uppercase; letter-spacing: .04em; }
.result .sub { color: var(--text-3); font-size: 12px; margin-left: auto; text-align: right; }
.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.filters select, .filters input[type="search"], .field input, .field select, .field textarea { padding: 6px 9px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface); min-width: 0; }
.filters input[type="search"] { min-width: 200px; flex: 1; max-width: 320px; }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: var(--radius-sm); overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: transparent; padding: 6px 11px; cursor: pointer; font-size: 13px; color: var(--text-2); }
.seg button + button { border-left: 1px solid var(--border); }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent-text); font-weight: 500; }

/* Surfaces */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; min-width: 0; }
.card.pad-0 { padding: 0; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
.card-head .meta { color: var(--text-3); font-size: 12.5px; }
.grid { display: grid; gap: 16px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.cards { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
.clickable { cursor: pointer; transition: border-color .12s; }
.clickable:hover { border-color: var(--border-strong); }
.muted { color: var(--text-2); } .faint { color: var(--text-3); } .small { font-size: 12.5px; }
.stack { display: grid; gap: 10px; } .stack-sm { display: grid; gap: 6px; }
.row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.spread { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
hr { border: 0; border-top: 1px solid var(--border); margin: 4px 0; }
ul.clean { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
ul.bullets { margin: 0; padding-left: 18px; display: grid; gap: 4px; }

/* KPI */
.kpis { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); }
.kpi { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; display: grid; gap: 4px; }
.kpi .label { color: var(--text-2); font-size: 12.5px; }
.kpi .value { font-size: 26px; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
.kpi .detail { color: var(--text-3); font-size: 12px; }

/* Chips & status */
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 1px 8px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--border); font-size: 12px; color: var(--text-2); white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
a.chip:hover, button.chip:hover { border-color: var(--border-strong); text-decoration: none; color: var(--text); }
button.chip { cursor: pointer; }
.chip.missing { border-style: dashed; color: var(--critical-text); }
.status { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 500; white-space: nowrap; }
.status .dot { width: 14px; height: 14px; display: inline-grid; place-items: center; flex: none; }
.s-verified { color: var(--good-text); } .s-implemented { color: var(--accent-text); } .s-in-progress { color: var(--violet-text); }
.s-planned { color: var(--text-2); } .s-blocked { color: var(--critical-text); } .s-investigate { color: var(--serious-text); }
.pill { display: inline-flex; align-items: center; gap: 5px; padding: 1px 8px; border-radius: 999px; font-size: 12px; font-weight: 500; border: 1px solid currentColor; white-space: nowrap; }
.p-deployed { color: var(--good-text); } .p-development, .p-testing { color: var(--accent-text); } .p-planning, .p-research, .p-idea { color: var(--violet-text); }
.p-paused { color: var(--text-3); } .p-abandoned { color: var(--text-3); text-decoration: line-through; }
.prio { font: 600 11px var(--mono); padding: 1px 5px; border-radius: 4px; background: var(--surface-2); color: var(--text-2); }
.prio.P0 { background: color-mix(in srgb, var(--critical) 16%, transparent); color: var(--critical-text); }
.prio.P1 { background: color-mix(in srgb, var(--serious) 18%, transparent); color: var(--serious-text); }
.tag-suggested { font-size: 11px; color: var(--violet-text); border: 1px dashed currentColor; border-radius: 4px; padding: 0 5px; }
.auth { font-size: 11px; padding: 0 6px; border-radius: 4px; background: var(--surface-2); color: var(--text-2); border: 1px solid var(--border); }
.auth.self-written { color: var(--good-text); border-color: currentColor; }
.auth.plan-only { color: var(--text-3); border-style: dashed; }

/* Mastery meter (ordinal ramp, + label) */
.mastery { display: inline-flex; align-items: center; gap: 7px; font-size: 12px; color: var(--text-2); white-space: nowrap; }
.mastery .bars { display: inline-flex; gap: 2px; }
.mastery .bars i { width: 6px; height: 12px; border-radius: 2px; background: var(--surface-3); display: block; }
.mastery .bars i.on { background: var(--m4); }
.mastery.revise .bars i.on { background: var(--serious); }

/* Progress */
.progress { display: grid; gap: 5px; }
.bar { height: 8px; border-radius: 4px; background: var(--surface-3); position: relative; overflow: hidden; }
.bar > span { position: absolute; inset: 0 auto 0 0; border-radius: 4px; }
.bar .impl { background: color-mix(in srgb, var(--accent) 38%, var(--surface-3)); }
.bar .ver { background: var(--good); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--text-2); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }

/* Pipeline flow */
.flow { display: flex; flex-wrap: wrap; align-items: stretch; gap: 22px 26px; padding: 4px 0; }
.stage { position: relative; width: 196px; background: var(--surface); border: 1px solid var(--border); border-left-width: 3px; border-radius: var(--radius-sm); padding: 9px 10px; display: grid; gap: 5px; align-content: start; cursor: pointer; text-align: left; }
.stage:hover { border-color: var(--border-strong); }
.stage.st-verified { border-left-color: var(--good); }
.stage.st-implemented { border-left-color: var(--accent); }
.stage.st-in-progress { border-left-color: var(--violet); }
.stage.st-planned { border-left-color: var(--neutral); border-style: dashed; border-left-style: solid; }
.stage.st-blocked { border-left-color: var(--critical); }
.stage.st-investigate { border-left-color: var(--serious); }
.stage[aria-expanded="true"] { box-shadow: 0 0 0 2px var(--accent); }
.stage .n { font-size: 11px; color: var(--text-3); font-variant-numeric: tabular-nums; }
.stage .name { font-weight: 600; font-size: 13px; line-height: 1.3; }
.stage .after { font-size: 11px; color: var(--text-3); }
.stage:not(:last-child)::after { content: ""; position: absolute; right: -22px; top: 50%; width: 16px; height: 2px; background: var(--border-strong); }
.stage:not(:last-child)::before { content: ""; position: absolute; right: -24px; top: calc(50% - 4px); border: 5px solid transparent; border-left-color: var(--border-strong); border-right: 0; }
.flow.compact .stage { width: 150px; padding: 6px 8px; }
.flow.compact .stage .name { font-size: 12px; }
.stage-detail { border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface-2); padding: 14px; display: grid; gap: 10px; }
.kv { display: grid; grid-template-columns: 130px minmax(0, 1fr); gap: 6px 14px; font-size: 13px; }
.kv dt { color: var(--text-3); } .kv dd { margin: 0; }

/* Tables */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; font-weight: 500; color: var(--text-3); font-size: 12px; padding: 8px 10px; border-bottom: 1px solid var(--border); white-space: nowrap; }
td { padding: 9px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
tbody tr:hover { background: var(--surface-2); }

/* Issues, lists */
.issue { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px; align-items: start; }
.issue-type { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; padding-top: 2px; width: 64px; }
.issue-type.bug { color: var(--serious-text); } .issue-type.blocker { color: var(--critical-text); } .issue-type.question { color: var(--violet-text); }
.empty { padding: 22px; text-align: center; color: var(--text-3); border: 1px dashed var(--border); border-radius: var(--radius); }
.unknown { color: var(--serious-text); font-style: italic; }
.note { border-left: 3px solid var(--accent); background: var(--accent-soft); padding: 10px 12px; border-radius: 0 var(--radius-sm) var(--radius-sm) 0; font-size: 13px; }
.note.warn { border-left-color: var(--serious); background: color-mix(in srgb, var(--serious) 10%, transparent); }
details > summary { cursor: pointer; list-style: none; }
details > summary::-webkit-details-marker { display: none; }
details > summary .chev { transition: transform .15s; display: inline-block; }
details[open] > summary .chev { transform: rotate(90deg); }

/* Timeline */
.tl-month { display: grid; gap: 8px; }
.tl-item { display: grid; grid-template-columns: 92px 110px minmax(0, 1fr); gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--border); align-items: baseline; }
.tl-item:last-child { border-bottom: 0; }
.tl-date { font-variant-numeric: tabular-nums; color: var(--text-3); font-size: 12.5px; }
.tl-type { font-size: 12px; font-weight: 500; }

/* Drawer & dialog */
.drawer { position: fixed; inset: 0 0 0 auto; width: min(560px, 100vw); grid-template-columns: minmax(0, 1fr); overflow-x: hidden; background: var(--surface); border-left: 1px solid var(--border); box-shadow: var(--shadow); z-index: 60; overflow-y: auto; padding: 20px; display: grid; gap: 16px; align-content: start; transform: translateX(105%); transition: transform .18s ease; }
.drawer.open { transform: none; }
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.25); z-index: 55; }
.scrim[hidden] { display: none; }
dialog { border: 1px solid var(--border); border-radius: var(--radius); padding: 0; background: var(--surface); color: var(--text); width: min(620px, calc(100vw - 32px)); box-shadow: var(--shadow); }
dialog::backdrop { background: rgba(0,0,0,.35); }
dialog form { display: grid; gap: 14px; padding: 20px; max-height: 85vh; overflow-y: auto; }
.field { display: grid; gap: 5px; }
.field label { font-size: 12.5px; color: var(--text-2); font-weight: 500; }
.field textarea { min-height: 72px; resize: vertical; }
.field .hint { font-size: 12px; color: var(--text-3); }
.toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 9px 16px; border-radius: 8px; font-size: 13px; z-index: 80; box-shadow: var(--shadow); }
.toast[hidden] { display: none; }

/* Concept map */
.map-wrap { overflow: auto; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); max-height: 72vh; }
.map-wrap svg { display: block; }
.map-node rect { fill: var(--surface); stroke: var(--border-strong); stroke-width: 1; }
.map-node text { fill: var(--text); font-size: 11.5px; font-family: var(--font); }
.map-node .lvl { fill: var(--text-3); font-size: 10px; }
.map-node { cursor: pointer; }
.map-node:hover rect, .map-node:focus rect { stroke: var(--accent); }
.map-node.sel rect { stroke: var(--accent); stroke-width: 2; }
.map-node.dim { opacity: .28; }
.map-edge { fill: none; stroke: var(--border-strong); stroke-width: 1.5; }
.map-edge.rel { stroke-dasharray: 3 3; }
.map-edge.hot { stroke: var(--accent); stroke-width: 2; }
.map-edge.dim { opacity: .12; }
.map-col-label { fill: var(--text-3); font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; }

/* Responsive */
.menu-btn { display: none; }
@media (max-width: 1080px) { .g3 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 860px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .sidebar { position: fixed; z-index: 70; width: 260px; transform: translateX(-105%); transition: transform .18s; }
  .sidebar.open { transform: none; box-shadow: var(--shadow); }
  .menu-btn { display: inline-flex; }
  .topbar { padding: 10px 16px; }
  .content { padding: 16px; }
  .g2, .g3 { grid-template-columns: minmax(0, 1fr); }
  .search kbd { display: none; }
  .flow { flex-direction: column; gap: 22px; }
  .stage, .flow.compact .stage { width: 100%; }
  .stage:not(:last-child)::after { right: auto; left: 50%; top: auto; bottom: -16px; width: 2px; height: 12px; }
  .stage:not(:last-child)::before { right: auto; left: calc(50% - 4px); top: auto; bottom: -20px; border: 5px solid transparent; border-top-color: var(--border-strong); border-bottom: 0; }
  .tl-item { grid-template-columns: 82px minmax(0, 1fr); }
  .tl-item .tl-type { grid-column: 2; }
  .tl-item .tl-body { grid-column: 1 / -1; }
  .kv { grid-template-columns: minmax(0, 1fr); gap: 2px; }
  .kv dd { margin-bottom: 8px; }
  .filters input[type="search"] { max-width: none; min-width: 0; width: 100%; }
  .hide-sm { display: none; }
  .cards { grid-template-columns: minmax(0, 1fr); }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
@media (forced-colors: active) { .bar > span { background: Highlight; } }
</style>

function importJson(file) {
  if (!file) return;
  if (file.size > 10 * 1024 * 1024) return toast('File too large (max 10 MB)');
  const reader = new FileReader();
  reader.onload = () => {
    let raw;
    try { raw = JSON.parse(String(reader.result)); } catch (e) { return toast('Import failed: not valid JSON'); }
    if (!raw || typeof raw !== 'object' || !Array.isArray(raw.projects)) return toast('Import failed: expected an object with a "projects" array');
    const next = normalize(raw);
    const msg = `Replace current data with ${next.projects.length} projects, ${next.pipelines.length} pipelines, ${next.concepts.length} concepts and ${next.tasks.length} tasks?`;
    if (!confirm(msg)) return;
    db = next;
    rebuildIndex();
    save('Imported');
    render();
  };
  reader.onerror = () => toast('Could not read the file');
  reader.readAsText(file);
}
function resetData() {
  if (!confirm('Reset to the built-in data? All edits stored in this browser will be lost. Export first if you want to keep them.')) return;
  storageDel(STORAGE_KEY);
  db = normalize(readSeed());
  persisted = false;

  toast('Reset to built-in data');
  render();
}

      { name: 'type', label: 'Type', type: 'select', options: ['commit', 'file', 'repo', 'doc', 'session', 'exercise', 'email', 'note'].map((x) => [x, x]), value: 'commit' },

      { name: 'projectId', label: 'Project', type: 'select', options: [['', '— none —'], ...projOpts()], value: ctx.projectId || '' },

/* =========================================================================
   SEARCH
   ========================================================================= */
function searchAll(q) {
  q = q.toLowerCase().trim();
  if (!q) return [];
  const terms = q.split(/\s+/);
  const hit = (text) => { const t = text.toLowerCase(); return terms.every((x) => t.includes(x)); };
  const score = (name, rest) => (name.toLowerCase().startsWith(q) ? 0 : name.toLowerCase().includes(q) ? 1 : hit(name) ? 2 : hit(rest) ? 3 : 9);
  const out = [];
  db.projects.forEach((p) => out.push({ kind: 'Project', label: p.name, sub: p.status, href: '#/project/' + p.id, s: score(p.name, [p.tagline, p.purpose, p.stack.join(' ')].join(' ')) }));
  db.pipelines.forEach((pl) => {
    out.push({ kind: 'Pipeline', label: pl.name, sub: getProject(pl.projectId)?.name || '', href: '#/pipeline/' + pl.id, s: score(pl.name, pl.purpose + ' ' + pl.type) });
    pl.stages.forEach((st) => out.push({ kind: 'Stage', label: st.name, sub: pl.name, href: '#/pipeline/' + pl.id + '/' + st.id, s: score(st.name, st.description + ' ' + st.tools.join(' ')) }));
  });
  db.concepts.forEach((c) => out.push({ kind: 'Concept', label: c.name, sub: c.category, href: '#/concept/' + c.id, s: score(c.name, c.explanation + ' ' + c.example) }));
  db.tasks.forEach((t) => out.push({ kind: 'Task', label: t.title, sub: t.status, href: '#/tasks/' + t.id, s: score(t.title, t.notes) }));
  db.evidence.forEach((e) => out.push({ kind: 'Evidence', label: e.title, sub: e.type, href: '#/evidence/' + e.id, s: score(e.title, e.ref + ' ' + e.note) + 1 }));
  return out.filter((x) => x.s < 9).sort((a, b) => a.s - b.s || a.label.length - b.label.length).slice(0, 14);
}
(function setupSearch() {
  const input = document.getElementById('search');
  const box = document.getElementById('search-results');
  const combo = document.getElementById('search-box');
  let items = [], idx = 0;
  const close = () => { box.hidden = true; combo.setAttribute('aria-expanded', 'false'); input.removeAttribute('aria-activedescendant'); };
  const paint = () => {
    box.replaceChildren(...(items.length ? items.map((r, i) => h('div', { class: 'result', role: 'option', id: 'sr-' + i, 'aria-selected': i === idx ? 'true' : 'false', onmousedown: (e) => { e.preventDefault(); go(r); } }, h('span', { class: 'kind' }, r.kind), h('span', null, r.label), h('span', { class: 'sub' }, r.sub))) : [h('div', { class: 'result faint' }, 'No matches')]));
    box.hidden = false; combo.setAttribute('aria-expanded', 'true');
    if (items.length) input.setAttribute('aria-activedescendant', 'sr-' + idx);
  };
  const go = (r) => { close(); input.value = ''; input.blur(); location.hash = r.href; };
  input.addEventListener('input', () => { items = searchAll(input.value); idx = 0; if (input.value.trim()) paint(); else close(); });
  input.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowDown') { e.preventDefault(); idx = Math.min(idx + 1, items.length - 1); paint(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); idx = Math.max(idx - 1, 0); paint(); }
    else if (e.key === 'Enter' && items[idx]) { e.preventDefault(); go(items[idx]); }
    else if (e.key === 'Escape') { close(); input.blur(); }
  });
  input.addEventListener('blur', () => setTimeout(close, 120));
})();

/* =========================================================================
   ROUTER & CHROME
   ========================================================================= */
function parseRoute() {
  const parts = location.hash.replace(/^#\/?/, '').split('/').map(decodeURIComponent);
  return { section: parts[0] || 'overview', a: parts[1], b: parts[2] };
}
let lastKey = '';
function render(keepScroll) {
  const { section: sec, a, b } = parseRoute();
  const main = document.getElementById('main');
  const y = window.scrollY;
  let view, active = sec;
  if (sec === 'concept') {
    // Concepts open in a drawer over the last section.
    active = prefs.lastSection || 'knowledge';
    if (lastKey.split('|')[0] !== active || !main.childElementCount || keepScroll) view = routeView(active);
    openConcept(a);
  } else {
    closeDrawerSilently();
    view = routeView(sec, a, b);
    if (['overview', 'projects', 'pipelines', 'knowledge', 'roadmap', 'tasks', 'timeline', 'evidence', 'manage'].includes(sec)) { prefs.lastSection = sec + (sec === 'knowledge' && a ? '/' + a : ''); savePrefs(); }
    active = sec === 'project' ? 'projects' : sec === 'pipeline' ? 'pipelines' : sec;
  }
  if (view) { main.replaceChildren(...[].concat(view).flat(Infinity).filter(Boolean)); }
  renderNav(active.split('/')[0]);
  const key = active + '|' + (sec === 'concept' ? '' : location.hash);
  if (!keepScroll && key !== lastKey && sec !== 'concept') window.scrollTo(0, 0); else if (keepScroll) window.scrollTo(0, y);
  lastKey = key;
  document.title = ({ overview: 'Overview', projects: 'Projects', project: getProject(a)?.name, pipelines: 'Pipelines', pipeline: getPipeline(a)?.name, knowledge: 'Knowledge', roadmap: 'Roadmap', tasks: 'Tasks', timeline: 'Timeline', evidence: 'Evidence', manage: 'Update data', concept: getConcept(a)?.name }[sec] || 'Overview') + ' · Command Center';
}
function routeView(sec, a, b) {
  if (sec.includes('/')) { const [x, y] = sec.split('/'); sec = x; a = y; }
  switch (sec) {
    case 'overview': return viewOverview();
    case 'projects': return viewProjects();
    case 'project': return viewProject(a);
    case 'pipelines': return viewPipelines();
    case 'pipeline': return viewPipeline(a, b);
    case 'knowledge': return viewKnowledge(a);
    case 'roadmap': return viewRoadmap();
    case 'tasks': return viewTasks(a);
    case 'timeline': return viewTimeline();
    case 'evidence': return viewEvidence(a);
    case 'manage': return viewManage();
    default: return notFound('section', sec);
  }
}
function closeDrawerSilently() { const d = document.getElementById('drawer'); d.classList.remove('open'); d.setAttribute('aria-hidden', 'true'); document.getElementById('scrim').hidden = true; }
function updateSaveState() {
  const el = document.getElementById('save-state');
  el.textContent = persisted ? 'Saved in this browser' + (db.meta.modifiedAt ? ' · ' + new Date(db.meta.modifiedAt).toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' }) : '') : 'Built-in data (no local edits)';
}
let toastTimer;
function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 2600); }

function applyTheme() {
  const root = document.documentElement;
  if (prefs.theme) root.setAttribute('data-theme', prefs.theme); else root.removeAttribute('data-theme');
  const dark = prefs.theme ? prefs.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  const btn = document.getElementById('theme-btn');
  btn.replaceChildren(s('svg', { width: 16, height: 16, viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', 'stroke-width': 2, 'stroke-linecap': 'round', 'aria-hidden': 'true' }, dark ? s('path', { d: 'M12 4V2M12 22v-2M4 12H2M22 12h-2M6 6L4.6 4.6M19.4 19.4L18 18M6 18l-1.4 1.4M19.4 4.6L18 6M12 8a4 4 0 100 8 4 4 0 000-8z' }) : s('path', { d: 'M20 14.5A8 8 0 019.5 4a8 8 0 1010.5 10.5z' })));
  btn.setAttribute('aria-label', dark ? 'Switch to light theme' : 'Switch to dark theme');
}
function toggleTheme() {
  const dark = prefs.theme ? prefs.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  prefs.theme = dark ? 'light' : 'dark';
  savePrefs(); applyTheme();
}
document.getElementById('theme-btn').addEventListener('click', toggleTheme);
document.getElementById('scrim').addEventListener('click', () => { closeDrawer(); closeSidebar(); });
document.getElementById('import-file').addEventListener('change', (e) => { importJson(e.target.files[0]); e.target.value = ''; });
const sidebar = document.getElementById('sidebar');
const menuBtn = document.getElementById('menu-btn');
function closeSidebar() { sidebar.classList.remove('open'); menuBtn.setAttribute('aria-expanded', 'false'); if (!document.getElementById('drawer').classList.contains('open')) document.getElementById('scrim').hidden = true; }
menuBtn.addEventListener('click', () => { const o = !sidebar.classList.contains('open'); sidebar.classList.toggle('open', o); menuBtn.setAttribute('aria-expanded', String(o)); document.getElementById('scrim').hidden = !o; });
sidebar.addEventListener('click', (e) => { if (e.target.closest('a')) closeSidebar(); });
document.addEventListener('keydown', (e) => {
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName) || document.activeElement?.isContentEditable;
  if (e.key === 'Escape') { if (document.getElementById('drawer').classList.contains('open')) closeDrawer(); closeSidebar(); return; }
  if (typing || e.metaKey || e.ctrlKey || e.altKey || document.getElementById('dialog').open) return;
  if (e.key === '/') { e.preventDefault(); document.getElementById('search').focus(); }
  else if (e.key === 't') toggleTheme();
  else if (/^[1-9]$/.test(e.key)) { const sec = SECTIONS[Number(e.key) - 1]; if (sec) location.hash = '#/' + sec[0]; }
});
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', applyTheme);
window.addEventListener('hashchange', () => render());
applyTheme();
updateSaveState();
render();
